<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src blob:; connect-src ipc: http://ipc.localhost; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Minternet Local Media Player</title>
<link rel="stylesheet" href="./media-player.css">
<script src="./media-player.js" defer></script></head>
<body data-mode="chooser">
  <main class="player-root">
    <div class="drag-zone" id="dragZone" title="Drag to Move" aria-label="Drag Player"></div>
    <button class="player-close" id="playerClose" type="button" aria-label="Close Player" title="Close">×</button>
    <section class="player-chooser" id="chooseSection">
      <button id="chooseFile" type="button" class="choose-file">▣ &nbsp; Select Local Video or Audio</button>
      <p>Uses locally supported codecs. Unrecognized formats show an error, never an automatic download.</p>
    </section>
    <input id="mediaFile" type="file" aria-label="Select Local Video or Audio" hidden>
    <video id="localVideo" playsinline preload="metadata" hidden></video>
    <audio id="localAudio" preload="metadata" hidden></audio>
    <div id="mediaError" role="status" hidden></div>
    <div class="player-controls" id="playerControls" hidden>
      <button id="togglePlayback" type="button" aria-label="Play or Pause" title="Play or Pause">▶</button>
      <input id="playbackPosition" type="range" min="0" max="1000" step="1" value="0" aria-label="Scrub Media">
    </div>
    <button id="resizeCorner" type="button" aria-label="Resize Player" title="Drag to Resize" hidden>◢</button>
  </main>
</body></html>
