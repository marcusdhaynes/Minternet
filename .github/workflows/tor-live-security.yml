name: Live Tor Transport and WebView Security
on:
  push:
    branches: [main]
    paths:
      - 'native/desktop/src-tauri/src/tor_transport.rs'
      - 'native/desktop/src-tauri/src/tor_live_probe.rs'
      - 'native/desktop/src-tauri/src/main.rs'
      - 'native/desktop/src-tauri/src/extensions.rs'
      - 'tests/tor-integration.test.cjs'
      - 'ui/tor-site-hardening.js'
      - '.github/workflows/tor-live-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '19 9 * * 1'
permissions:
  contents: read
concurrency:
  group: live-tor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-real-tor:
    name: Windows real Arti exit and WebView2 routing
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop/src-tauri -> target
      - name: Build actual Minternet and run Rust tests
        working-directory: native/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/generate_icons.py
          npm install --no-fund --no-audit
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify embedded Arti exit, remote DNS, SOCKS deny and HTTPS onion
        working-directory: native/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "src-tauri/target/release/minternet_native.exe").Path
          $outFile = Join-Path $env:RUNNER_TEMP "tor-transport-output.txt"
          $errorFile = Join-Path $env:RUNNER_TEMP "tor-transport-error.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-tor-transport-smoke" -RedirectStandardOutput $outFile -RedirectStandardError $errorFile -PassThru -WindowStyle Hidden
          try {
            if (!$p.WaitForExit(650000)) { throw "Live Tor transport timed out" }
            if ($p.ExitCode -ne 0) {
              $log=Get-Content $errorFile -Raw -ErrorAction SilentlyContinue
              throw "Embedded Arti test failed: $log"
            }
            $proof=Get-Content $outFile -Raw
            if ($proof -notmatch "PASS: Embedded Arti verified by Tor Project") {
              throw "Embedded Arti test exited without authenticated-exit proof"
            }
            "PASS: Embedded Arti reached a Tor exit and a HTTPS v3 onion service." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $p.Refresh()
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Verify real WebView2 Tor exit, WebRTC and DNS cache
        working-directory: native/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Clear-DnsClientCache -ErrorAction Stop
          $exe = (Resolve-Path "src-tauri/target/release/minternet_native.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-tor-browser-smoke" -PassThru
          $passed = Join-Path $env:TEMP "minternet-tor-browser-$($p.Id).ok"
          $failed = Join-Path $env:TEMP "minternet-tor-browser-$($p.Id).failed"
          try {
            $ok=$false
            for ($n=0;$n -lt 240;$n++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) { throw "WebView2 exited before Tor verification" }
              if (Test-Path -LiteralPath $failed) {
                throw "Tor WebView2 probe failed: $(Get-Content $failed -Raw)"
              }
              if (Test-Path -LiteralPath $passed) {$ok=$true;break}
            }
            if (!$ok) { throw "WebView2 did not prove its Tor exit and blocked WebRTC" }
            $proof=Get-Content $passed -Raw
            if ($proof -notmatch "PASS: real WebView2 Tor exit confirmed") {throw "Invalid Tor browser proof"}
            $dns=@(Get-DnsClientCache -ErrorAction Stop | Where-Object {$_.Entry -match '(^|\.)check\.torproject\.org$'})
            if ($dns.Count -gt 0) { throw "Tor check hostname appeared in Windows DNS cache: potential leak" }
            "PASS: Native WebView2 loaded IsTor=true; WebRTC constructor absent; no check host in Windows DNS cache." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $p.Refresh()
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item $passed,$failed -Force -ErrorAction SilentlyContinue
          }
      - name: Record verification limits
        if: always()
        shell: pwsh
        run: |
          "LIMIT: This is not a full packet capture or fingerprinting audit. It cannot certify Tor Browser anonymity equivalence." >> $env:GITHUB_STEP_SUMMARY
  linux-real-tor:
    name: Linux real Arti exit and onion transport
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop/src-tauri -> target
      - name: Install Linux native webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build actual Minternet and run Rust tests
        working-directory: native/desktop
        run: |
          npm install --no-fund --no-audit
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify embedded Tor exit and onion service through Minternet SOCKS
        working-directory: native/desktop
        run: |
          set -euo pipefail
          timeout 650s src-tauri/target/release/minternet_native --minternet-tor-transport-smoke
          echo "PASS: Linux embedded Arti reached a real Tor exit and HTTPS onion service." >> "$GITHUB_STEP_SUMMARY"
      - name: Record verification limits
        if: always()
        run: |
          echo "LIMIT: This does not run Linux WebKitGTK renderer, packet capture or fingerprinting audit." >> "$GITHUB_STEP_SUMMARY"
