name: Native Minternet iOS simulator build (under 50 MB)
on:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native iOS project
        working-directory: native/ios
        run: xcodegen generate
      - name: Build unsigned iPhone/iPad simulator app
        working-directory: native/ios
        run: |
          xcodebuild -project Minternet.xcodeproj -scheme Minternet \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Launch Minternet on Apple iOS simulator and capture first frame
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; data=json.load(sys.stdin); print(next((d["udid"] for arr in data["devices"].values() for d in arr if d["isAvailable"] and "iPhone" in d["name"]), ""))')
          if [ -z "$DEVICE" ]; then echo "No available iPhone simulator"; exit 1; fi
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" native/ios/build/Build/Products/Debug-iphonesimulator/Minternet.app
          xcrun simctl launch "$DEVICE" app.minternet.browser.ios
          sleep 5
          xcrun simctl io "$DEVICE" screenshot /tmp/Minternet-iOS-launch.png
          test -s /tmp/Minternet-iOS-launch.png
      - name: Upload simulator startup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minternet-ios-simulator-launch-evidence
          path: /tmp/Minternet-iOS-launch.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Package simulator .app and verify its compressed size
        run: |
          set -eu
          cd native/ios/build/Build/Products/Debug-iphonesimulator
          test -d Minternet.app
          zip -qr /tmp/Minternet-iOS-Simulator.zip Minternet.app
          bytes=$(wc -c < /tmp/Minternet-iOS-Simulator.zip | tr -d ' ')
          echo "Unsigned iOS simulator app ZIP: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 50000000
      - uses: actions/upload-artifact@v4
        with:
          name: minternet-ios-simulator
          path: /tmp/Minternet-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
