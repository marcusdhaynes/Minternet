name: Minternet Windows portable single EXE (under 50 MB)
on:
  push:
    branches: [main]
    paths:
      - 'native/desktop/**'
      - 'ui/**'
      - 'tests/**'
      - 'docs/preview-bridge.js'
      - '.github/workflows/native-windows.yml'
      - '.github/workflows/publish-current-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop/src-tauri -> target
      - name: Install Tauri CLI
        run: npm install --no-fund --no-audit
      - name: Validate browser UI and bookmark model
        run: |
          node --check ../../ui/native-bridge.js
          node --check ../../ui/app.js
          node --check ../../ui/browser-settings.js
          node --check ../../ui/tab-blank-zones.js
          node --check ../../ui/downloads-ui.js
          node --check ../../ui/bookmark-model.js
          node --check ../../ui/bookmark-import.js
          node --check ../../ui/bookmark-ui.js
          node --check ../../ui/secret-bookmarks.js
          node --check ../../ui/tab-group-model.js
          node --check ../../ui/tab-group-ui.js
          node --check ../../ui/chrome-native-menu.js
          node --check ../../ui/search-settings.js
          node --check ../../ui/volume-ui.js
          node --check ../../ui/audio-gain.js
          node --check ../../ui/credential-import.js
          node --test ../../tests/bookmarks.test.cjs ../../tests/bookmark-import.test.cjs ../../tests/tab-groups.test.cjs ../../tests/native-menus.test.cjs ../../tests/search-settings.test.cjs ../../tests/rapid-bookmarks-volume-import.test.cjs ../../tests/tab-blank-zones.test.cjs ../../tests/browser-home-download.test.cjs ../../tests/tab-limit.test.cjs
      - name: Generate Branded Minternet App Icons
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/generate_icons.py
      - name: Build native portable EXE with embedded UI, no installer
        run: npm run build
      - name: Verify password vault cryptography and split-window geometry
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Copy EXE ALONE to clean directory, ensure no sidecar dependencies
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src-tauri/target/release/minternet_native.exe").Path
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\minternet-portable" -Force | Out-Null
          Copy-Item -Path $exe -Destination "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe" -Force
          $files = @(Get-ChildItem "$env:RUNNER_TEMP\minternet-portable" -File)
          if ($files.Count -ne 1) { throw "Portable test directory must contain exactly one EXE" }
          $bytes = $files[0].Length
          "Minternet standalone EXE: $bytes bytes" >> $env:GITHUB_STEP_SUMMARY
          if ($bytes -ge 50000000) { throw "Portable executable exceeds 50,000,000 bytes" }
          Copy-Item $files[0].FullName "Minternet-Portable-x64.exe"
      - name: Test real website navigation INSIDE native WebView2 via chrome IPC
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-smoke" -PassThru
          $marker = Join-Path $env:TEMP "minternet-inapp-$($p.Id).ok"
          try {
            $found = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Native Minternet exited during real-site smoke test" }
              if (Test-Path $marker) { $found = $true; break }
            }
            if (!$found) { throw "Minternet did not report loading example.com in its native child webview" }
            if ($p.MainWindowHandle -eq [IntPtr]::Zero) { throw "Minternet has no native window" }
            $proof = Get-Content $marker -Raw
            if ($proof -notmatch "Example Domain loaded in Minternet WebView2") {
              throw "Incorrect native webview confirmation: $proof"
            }
            "PASS: Chrome IPC navigated to example.com and WebView2 returned the page title inside Minternet." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $marker -Force -ErrorAction SilentlyContinue
          }
      - name: Verify OAuth popup renders with a working native window.opener
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-auth-popup-smoke" -PassThru
          $marker = Join-Path $env:TEMP "minternet-auth-popup-$($p.Id).ok"
          try {
            $passed = $false
            for ($i = 0; $i -lt 35; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Browser exited during native OAuth popup test" }
              if (Test-Path $marker) { $passed = $true; break }
            }
            if (!$passed) { throw "Popup did not render with a valid window.opener" }
            "PASS: WebView2 related OAuth popup rendered and retained its opener." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $marker -Force -ErrorAction SilentlyContinue
          }
      - name: Verify turbo-warmed browser view also navigates internally
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-turbo-smoke" -PassThru
          $warm = Join-Path $env:TEMP "minternet-prepared-$($p.Id).ok"
          $site = Join-Path $env:TEMP "minternet-inapp-$($p.Id).ok"
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Portable Minternet exited during turbo navigation test" }
              if ((Test-Path $warm) -and (Test-Path $site)) { $ok = $true; break }
            }
            if (!$ok) { throw "The prewarmed WebView2 did not complete internal HTTPS navigation" }
            "PASS: warm controller was created before example.com loaded in Minternet." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $warm,$site -ErrorAction SilentlyContinue
          }
      - name: Verify Bookmark Bar, Settings and nested folder persistence through UI
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-bookmarks-smoke" -PassThru
          $proof = Join-Path $env:TEMP "minternet-bookmarks-$($p.Id).ok"
          try {
            $ok = $false
            for ($i = 0; $i -lt 35; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Minternet exited during bookmark UI smoke test" }
              if (Test-Path $proof) { $ok = $true; break }
            }
            if (!$ok) { throw "Nested bookmark folders or toolbar visibility failed" }
            "PASS: bookmark settings, unnamed emoji folders, nested folders and local persistence." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$p.HasExited) {
              $null = $p.CloseMainWindow()
              $null = $p.WaitForExit(6000)
              if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            }
            Remove-Item $proof -Force -ErrorAction SilentlyContinue
          }
      - name: Verify bookmark tree survives restarting portable Minternet
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-bookmarks-reopen" -PassThru
          $proof = Join-Path $env:TEMP "minternet-bookmarks-$($p.Id).ok"
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Minternet exited during bookmark persistence check" }
              if (Test-Path $proof) { $ok = $true; break }
            }
            if (!$ok) { throw "Bookmark data was not retained after application restart" }
            "PASS: bookmark tree survives portable EXE restart." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $proof -Force -ErrorAction SilentlyContinue
          }
      - name: Verify native anchored folders, cascading submenus and group eye toggles
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-menus-smoke" -PassThru
          $proof = Join-Path $env:TEMP "minternet-menus-$($p.Id).ok"
          $trace = Join-Path $env:TEMP "minternet-menus-stage-$($p.Id).txt"
          # Native Windows context menus remain open until dismissed. Send a
          # genuine Escape key to finish popup processing as a user would.
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class MinternetKeys { [DllImport("user32.dll")] public static extern void keybd_event(byte key, byte scan, uint flags, UIntPtr extra); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); }'
          try {
            $ok = $false
            for ($i = 0; $i -lt 28; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Minternet exited during native folder/menu smoke" }
              if ($i -eq 3 -or $i -eq 6) {
                $null = [MinternetKeys]::SetForegroundWindow($p.MainWindowHandle)
                [MinternetKeys]::keybd_event(27,0,0,[UIntPtr]::Zero)
                Start-Sleep -Milliseconds 120
                [MinternetKeys]::keybd_event(27,0,2,[UIntPtr]::Zero)
              }
              if (Test-Path $proof) { $ok = $true; break }
            }
            if (!$ok) { throw "Native folder popup, cascading submenu or group-eye toggle failed" }
            "PASS: anchored native folder popup, nested submenu and tab group eye visibility." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (Test-Path $trace) {
              "Native-menu diagnostic stages:"
              Get-Content $trace
            }
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $proof,$trace -Force -ErrorAction SilentlyContinue
          }
      - name: Verify double-click window restore and compact favicon-only tabs
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-rapid-ui-smoke" -PassThru
          $maxMarker = Join-Path $env:TEMP "minternet-rapid-$($p.Id)-maximize.ok"
          $restoreMarker = Join-Path $env:TEMP "minternet-rapid-$($p.Id)-restore.ok"
          try {
            $found = $false
            for ($i=0;$i -lt 35;$i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Minternet closed during rapid UI test" }
              if ((Test-Path $maxMarker) -and (Test-Path $restoreMarker)) { $found=$true;break }
            }
            if (!$found) { throw "Double-click maximize/restore or compact chrome invariant failed" }
            "PASS: title-bar maximize/restore; jade rabbit logo far left; favicon-only narrow tabs; Tor-only; no footer; Google setting; compact bookmarks." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $debug = @(Get-ChildItem $env:TEMP -Filter "minternet-rapid-stage-$($p.Id)-*.txt" -ErrorAction SilentlyContinue)
            foreach ($file in $debug) {
              Write-Host "$($file.Name): $(Get-Content $file.FullName -Raw)"
            }
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $maxMarker,$restoreMarker -Force -ErrorAction SilentlyContinue
            $debug | Remove-Item -Force -ErrorAction SilentlyContinue
          }
      - name: Verify pointer gestures join and leave groups inside WebView2
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-pointer-smoke" -PassThru
          $marker = Join-Path $env:TEMP "minternet-pointer-$($p.Id).ok"
          try {
            $passed = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Browser exited during pointer tab-group test" }
              if (Test-Path $marker) { $passed = $true; break }
            }
            if (!$passed) { throw "Pointer gestures did not join and leave the group" }
            "PASS: pointer-drag tab into/out of group without native DataTransfer." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $marker -Force -ErrorAction SilentlyContinue
          }
      - name: Verify Google default and alternative search from native address bar
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-search-smoke" -PassThru
          $google = Join-Path $env:TEMP "minternet-search-$($p.Id)-google.ok"
          $brave = Join-Path $env:TEMP "minternet-search-$($p.Id)-brave.ok"
          try {
            $passed = $false
            for ($i = 0; $i -lt 35; $i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Browser exited during search test" }
              if ((Test-Path $google) -and (Test-Path $brave)) { $passed = $true; break }
            }
            if (!$passed) { throw "Default and selected engine searches did not route internally" }
            "PASS: plain text searches Google or the selected HTTPS engine inside Minternet." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $trace = Join-Path $env:TEMP "minternet-search-stage-$($p.Id).txt"
            $checks = @(Get-ChildItem $env:TEMP -Filter "minternet-search-check-$($p.Id)-*.txt" -ErrorAction SilentlyContinue)
            if (Test-Path $trace) { Write-Host "Search UI stages:"; Get-Content $trace }
            foreach ($check in $checks) { Write-Host "$($check.Name): $(Get-Content $check.FullName -Raw)" }
            Write-Host "Google confirmed: $(Test-Path $google); Brave confirmed: $(Test-Path $brave)"
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item $google,$brave,$trace -Force -ErrorAction SilentlyContinue
            $checks | Remove-Item -Force -ErrorAction SilentlyContinue
          }
      - name: Verify native pinned tabs restore, tabless homepage and first navigation
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\minternet-portable\Minternet-Portable-x64.exe"
          $saved = Join-Path $env:TEMP "minternet-ci-pinned-tabs.v1.json"
          Remove-Item $saved -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-pin-smoke" -PassThru
          $pinned = Join-Path $env:TEMP "minternet-pin-$($p.Id)-pinned.ok"
          try {
            $success=$false
            for($i=0;$i -lt 30;$i++) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if($p.HasExited){throw "Minternet exited during pin test"}
              if(Test-Path $pinned){$success=$true;break}
            }
            if(!$success){throw "Failed to pin a website in the real tab strip"}
            if(!(Test-Path $saved)){throw "Pinned URLs were not saved"}
          } finally {
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force}
            Remove-Item $pinned -Force -ErrorAction SilentlyContinue
          }
          $p = Start-Process -FilePath $exe -ArgumentList "--minternet-pin-reopen-smoke" -PassThru
          $restored = Join-Path $env:TEMP "minternet-pin-$($p.Id)-restored.ok"
          $tabless = Join-Path $env:TEMP "minternet-pin-$($p.Id)-tabless.ok"
          $first = Join-Path $env:TEMP "minternet-pin-$($p.Id)-new-first.ok"
          try {
            $success=$false
            for($i=0;$i -lt 35;$i++){
              Start-Sleep -Seconds 2
              $p.Refresh()
              if($p.HasExited){throw "Minternet exited while restoring pinned tab"}
              if((Test-Path $restored) -and (Test-Path $tabless) -and (Test-Path $first)){
                $success=$true;break
              }
            }
            if(!$success){throw "Pin restore, last-tab close, or first home navigation failed"}
            "PASS: pin website, restore pinned site after restart, close final tab without replacement, create tab only upon navigation." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force}
            Remove-Item $restored,$tabless,$first,$saved -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Minternet-Portable-Windows-x64
          path: native/desktop/Minternet-Portable-x64.exe
          if-no-files-found: error
          retention-days: 21
