name: Native Minternet Windows EXE (< 50 MB)
on:
  push:
    branches: [main]
    paths:
      - 'native/desktop/**'
      - 'ui/**'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop/src-tauri -> target
      - name: Install CLI
        run: npm install --no-fund --no-audit
      - name: Verify JavaScript
        run: node --check ../../ui/native-bridge.js
      - name: Build installer using installed WebView2 runtime
        run: npm run build
      - name: Windows GUI startup smoke test (hosted runner, not physical-device testing)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src-tauri/target/release/minternet_native.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) { throw "Minternet browser closed during startup (exit $($p.ExitCode))" }
            if ($p.MainWindowHandle -eq [IntPtr]::Zero) {
              throw "Minternet failed to create a native Windows top-level window"
            }
            "Windows runtime smoke: browser launched with a native window." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Measure unpacked native app executable
        shell: pwsh
        run: |
          $binary = Get-Item "src-tauri/target/release/minternet_native.exe"
          $bytes = $binary.Length
          "Minternet unpacked native EXE: $bytes bytes" >> $env:GITHUB_STEP_SUMMARY
          if ($bytes -ge 50000000) { throw "Native executable exceeds 50,000,000 bytes" }
      - name: Enforce under 50MB Windows installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter '*.exe' -File -Recurse)
          if ($files.Count -eq 0) { throw "No NSIS EXE produced" }
          foreach ($file in $files) {
            $bytes = $file.Length
            "Minternet Windows EXE: $bytes bytes" >> $env:GITHUB_STEP_SUMMARY
            if ($bytes -ge 50000000) { throw "Installer exceeds 50,000,000 bytes" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: minternet-native-windows-exe
          path: native/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
