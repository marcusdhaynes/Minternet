name: Native Minternet Android APK (< 50 MB)
on:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runners already provide a supported Android SDK and sdkmanager.
      - name: Install Android platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build native Android app (no bundled Chromium)
        working-directory: native/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Enforce 50 MiB APK maximum
        run: |
          set -e
          APK=native/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "Android APK: $BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$BYTES" -lt 52428800
      - uses: actions/upload-artifact@v4
        with:
          name: minternet-android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
