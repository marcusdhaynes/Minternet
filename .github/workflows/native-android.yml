name: Native Minternet Android APK (< 50 MB)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  # write is scoped to THIS Android workflow only, solely so the verified
  # signed APK can be published to the permanent android-latest release.
  contents: write
concurrency:
  # Android-only queue: a newer push cancels a stale in-progress Android
  # build so old runs can never block or publish over newer ones. Other
  # platform workflows use their own groups and are unaffected.
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Android Jade Rabbit Icons
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python native/desktop/scripts/generate_icons.py
          # Ubuntu runners already provide a supported Android SDK and sdkmanager.
      - name: Install Android platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require persistent distribution signing identity
        env:
          MINTERNET_ANDROID_KEYSTORE_B64: ${{ secrets.MINTERNET_ANDROID_KEYSTORE_B64 }}
          MINTERNET_ANDROID_STORE_PASSWORD: ${{ secrets.MINTERNET_ANDROID_STORE_PASSWORD }}
          MINTERNET_ANDROID_KEY_PASSWORD: ${{ secrets.MINTERNET_ANDROID_KEY_PASSWORD }}
          MINTERNET_ANDROID_KEY_ALIAS: ${{ vars.MINTERNET_ANDROID_KEY_ALIAS }}
          MINTERNET_ANDROID_CERT_SHA256: ${{ vars.MINTERNET_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in MINTERNET_ANDROID_KEYSTORE_B64 MINTERNET_ANDROID_STORE_PASSWORD MINTERNET_ANDROID_KEY_PASSWORD MINTERNET_ANDROID_KEY_ALIAS MINTERNET_ANDROID_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Configure persistent Android signing; refusing to publish a differently signed APK."
              exit 1
            fi
          done
          expected=$(printf '%s' "$MINTERNET_ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Invalid pinned SHA-256 certificate fingerprint"; exit 1; }
      - name: Set monotonic distribution version code
        run: |
          set -euo pipefail
          code=$((100000000 + GITHUB_RUN_NUMBER))
          test "$code" -le 2100000000
          echo "MINTERNET_ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Build unsigned native release APK
        working-directory: native/android
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Sign and verify with persistent Android key
        env:
          MINTERNET_ANDROID_KEYSTORE_B64: ${{ secrets.MINTERNET_ANDROID_KEYSTORE_B64 }}
          MINTERNET_ANDROID_STORE_PASSWORD: ${{ secrets.MINTERNET_ANDROID_STORE_PASSWORD }}
          MINTERNET_ANDROID_KEY_PASSWORD: ${{ secrets.MINTERNET_ANDROID_KEY_PASSWORD }}
          MINTERNET_ANDROID_KEY_ALIAS: ${{ vars.MINTERNET_ANDROID_KEY_ALIAS }}
          MINTERNET_ANDROID_CERT_SHA256: ${{ vars.MINTERNET_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/minternet-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$MINTERNET_ANDROID_KEYSTORE_B64" | base64 --decode > "$signing_dir/key.jks"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned=native/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          "$tools/zipalign" -f -p 4 "$unsigned" "$signing_dir/aligned.apk"
          mkdir -p release/android
          apk=release/android/Minternet-Android.apk
          "$tools/apksigner" sign --ks "$signing_dir/key.jks" \
            --ks-key-alias "$MINTERNET_ANDROID_KEY_ALIAS" \
            --ks-pass env:MINTERNET_ANDROID_STORE_PASSWORD \
            --key-pass env:MINTERNET_ANDROID_KEY_PASSWORD \
            --out "$apk" "$signing_dir/aligned.apk"
          report=$("$tools/apksigner" verify --verbose --print-certs "$apk")
          actual=$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$MINTERNET_ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected" || { echo "::error::Android signer mismatch. No APK will be published."; exit 1; }
          badging=$("$tools/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='app.minternet.browser' versionCode='$MINTERNET_ANDROID_VERSION_CODE'"
          "$tools/zipalign" -c -p 4 "$apk"
          test "$(stat -c%s "$apk")" -lt 52428800
          echo "Verified Android signing certificate: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Android versionCode: $MINTERNET_ANDROID_VERSION_CODE; source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: minternet-android-signed-apk-${{ github.sha }}
          path: release/android/Minternet-Android.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified APK to permanent android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          MINTERNET_ANDROID_CERT_SHA256: ${{ vars.MINTERNET_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=release/android/Minternet-Android.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          new_code="$MINTERNET_ANDROID_VERSION_CODE"
          # Never let an older build replace a newer published APK: compare
          # against the versionCode of the APK already on android-latest.
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prev_dir=$(mktemp -d)
            if gh release download android-latest --repo "$GITHUB_REPOSITORY" \
                 --pattern 'Minternet-Android.apk' --dir "$prev_dir" 2>/dev/null; then
              prev_code=$("$tools/aapt" dump badging "$prev_dir/Minternet-Android.apk" \
                | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
              if [[ -n "$prev_code" && "$prev_code" -ge "$new_code" ]]; then
                echo "android-latest already carries versionCode $prev_code (>= $new_code); keeping it." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          (cd release/android && sha256sum Minternet-Android.apk > SHA256SUMS.txt)
          notes_file=$(mktemp)
          {
            echo "Minternet for Android — permanent verified distribution APK."
            echo ""
            echo "- Direct download (always the newest verified build): https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/Minternet-Android.apk"
            echo "- Application ID: app.minternet.browser"
            echo "- versionCode: $new_code"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Signing certificate SHA-256: $MINTERNET_ANDROID_CERT_SHA256"
            echo "- Successful build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Every build published here uses the same permanent signing identity, so updates install in place and preserve app data. Installs signed with the old ephemeral debug keys (all builds before this release) cannot update in place to this signing identity; see native/android/MIGRATION.md for the one-time migration."
          } > "$notes_file"
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest release/android/Minternet-Android.apk release/android/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-latest --repo "$GITHUB_REPOSITORY" \
              --title "Minternet for Android — latest verified APK" --notes-file "$notes_file" --latest=false
          else
            gh release create android-latest release/android/Minternet-Android.apk release/android/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "Minternet for Android — latest verified APK" --notes-file "$notes_file" --latest=false
          fi
          echo "Published android-latest at versionCode $new_code" >> "$GITHUB_STEP_SUMMARY"
