name: Desktop build (unsigned preview)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ui/**'
      - 'package.json'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Jade Rabbit Native Icons
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python native/desktop/scripts/generate_icons.py
      - run: npm install --no-fund --no-audit
      - run: npm run check
      - run: npm test
      - name: Package preview
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: minternet-unsigned-${{ runner.os }}
          path: release/
          retention-days: 7
