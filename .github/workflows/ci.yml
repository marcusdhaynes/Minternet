name: Security and tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-fund --no-audit
      - run: npm run check
      - name: Full test suite
        run: npm test
      # Repeat the affected regression suite 10 times on the exact checked-out
      # commit. Each iteration must pass independently; no failures masked.
      - name: Ten consecutive OAuth, WebAuthn, removal and geometry checks
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 10); do
            echo "::group::Verification cycle $n/10"
            node --test tests/custom-context-tabs.test.cjs tests/browser-core-guards.test.cjs tests/native-startup-geometry.test.cjs tests/native-compositor-geometry.test.cjs tests/render-health.test.cjs tests/passkeys-auth-popup.test.cjs tests/supertab.test.cjs tests/bookmark-settings-import.test.cjs tests/spellcheck-label.test.cjs
            echo "::endgroup::"
          done
      - run: npm audit --audit-level=high
