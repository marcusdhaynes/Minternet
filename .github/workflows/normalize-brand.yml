name: Normalize Minternet transparent source icon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand.yml'
      - 'native/desktop/scripts/generate_icons.py'
      - 'ui/minternet-coin-source.webp.b64'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: minternet-normalize-brand
  cancel-in-progress: false
jobs:
  transparent-master:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair transparency in shared source image
        run: |
          python -m pip install --quiet pillow
          python native/desktop/scripts/generate_icons.py --normalize-source
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("ui/minternet-brand.png").convert("RGBA")
          for point in [(0,0),(source.width-1,0),(0,source.height-1),(source.width-1,source.height-1)]:
              assert source.getpixel(point)[3] == 0, f"Opaque corner remains: {point}"
          for filename in ["native/desktop/src-tauri/icons/icon.png",
                           "native/android/app/src/main/res/mipmap-mdpi/ic_launcher.png"]:
              asset = Image.open(filename).convert("RGBA")
              assert asset.getpixel((0,0))[3] == 0, f"Nontransparent icon: {filename}"
          print("Verified RGBA transparent corners across shared icons.")
          PY
      - name: Commit generated icons for all supported platforms
        run: |
          git add ui/minternet-brand.png
          git add native/desktop/src-tauri/icons/
          git add native/android/app/src/main/res/
          git add native/ios/Assets.xcassets/
          if git diff --cached --quiet; then
            echo "Source artwork already had transparent corners."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Propagate transparent jade rabbit coin across Minternet app icons"
          # Other rapid browser fixes may land while the images generate.
          # Rebase the generated assets onto the latest main, never force-push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Could not publish regenerated icons without overwriting main" >&2
          exit 1
