name: Publish current Minternet Portable Windows download
on:
  workflow_run:
    workflows: ["Minternet Windows portable single EXE (under 50 MB)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful native Windows build run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch only a successful first-party Windows portable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="$INPUT_RUN_ID"
          if [ -z "$RUN_ID" ]; then RUN_ID="$TRIGGER_RUN_ID"; fi
          test -n "$RUN_ID"
          DETAILS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          NAME=$(echo "$DETAILS" | jq -r .name)
          RESULT=$(echo "$DETAILS" | jq -r .conclusion)
          BRANCH=$(echo "$DETAILS" | jq -r .head_branch)
          SRC=$(echo "$DETAILS" | jq -r .head_repository.full_name)
          SHA=$(echo "$DETAILS" | jq -r .head_sha)
          test "$NAME" = 'Minternet Windows portable single EXE (under 50 MB)'
          test "$RESULT" = success
          test "$BRANCH" = main
          test "$SRC" = "$GITHUB_REPOSITORY"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          mkdir -p release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name Minternet-Portable-Windows-x64 --dir release
          test -f release/Minternet-Portable-x64.exe
          BYTES=$(stat -c%s release/Minternet-Portable-x64.exe)
          test "$BYTES" -gt 1000000
          test "$BYTES" -lt 50000000
          (cd release && sha256sum Minternet-Portable-x64.exe > Minternet-Portable-x64.exe.sha256)
          echo "Verified test-passing Windows binary: $BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Multiple Windows jobs may finish out of order. Never publish an
          # older successful build over a newer one from the same main branch.
          LATEST=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow native-windows.yml --branch main \
            --limit 40 --json databaseId,conclusion \
            | jq -r '[.[] | select(.conclusion == "success")][0].databaseId')
          if [ "$SOURCE_RUN_ID" != "$LATEST" ]; then
            echo "Skipping older Windows run $SOURCE_RUN_ID (latest pass: $LATEST)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$SHA" != "$CURRENT" ]; then
            echo "Skipping stale Windows binary $SHA; main is $CURRENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TAG=v0.6.0-pointer-tabs-search
          cat > notes.md <<'NOTES'
          ## Minternet Portable — Pointer Tabs and Default Search

          Single-file Windows x64 EXE under 50 MB; uses Windows WebView2 and
          saves application/profile data separately. No installer.

          - M brand icon is far left; Tab Groups icon remains immediately to its right.
          - Tabs use pointer-driven drag previews and group/ungroup placement,
            avoiding Windows WebView2's forbidden HTML drag cursor.
          - Bookmark Bar entries use tight spacing; folders stay accessible.
          - Removed the bottom Ready to explore status bar.
          - Removed the Normal button and both Normal/Tor text labels.
            The remaining Tor icon is informational only; Tor is NOT integrated.
          - Plain-text address searches use Google automatically, inside Minternet.
          - Settings: Google, DuckDuckGo, Bing, Brave Search, Startpage, Ecosia.
            Search preference is local and persists between launches.
          - Existing bookmarks, folders and tab-group definitions are preserved.

          Browser security has NOT received an independent production audit.

          Download the EXE under Assets. This is an unsigned development build.
          Windows WebView2 runtime and its normal per-user browser data are separate.
          NOT audited or guaranteed compatible with every website.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Minternet-Portable-x64.exe \
              release/Minternet-Portable-x64.exe.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --target "$SHA" --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              release/Minternet-Portable-x64.exe release/Minternet-Portable-x64.exe.sha256 \
              --title "Minternet Portable — Pointer Tabs and Search Settings" \
              --notes-file notes.md --prerelease --target "$SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Minternet-Portable-x64.exe" >> "$GITHUB_STEP_SUMMARY"
