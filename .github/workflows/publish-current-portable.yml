name: Archive every successful Minternet build to GitHub Releases
on:
  # Reconcile missing rollback archives gradually instead of dispatching
  # dozens of release uploads simultaneously and hitting GitHub rate limits.
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows:
      - "Minternet Windows portable single EXE (under 50 MB)"
      - "Native Minternet macOS and Linux (under 50 MB)"
      - "Native Minternet Android APK (< 50 MB)"
      - "Native Minternet iOS simulator build (under 50 MB)"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful first-party native build run ID to archive
        required: true
        type: string
permissions:
  actions: write
  contents: write
concurrency:
  # GitHub concurrency only retains ONE pending run per group. Separate
  # successful build IDs must never cancel one another, even under load.
  group: archive-minternet-build-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false
jobs:
  reconcile-missing-archives:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retry up to three missing successful build archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatched=0
          # Include recent full-native builds across all platforms. All old
          # confirmed releases remain untouched, and later runs are retried
          # on future hourly checks while Actions artifacts remain available.
          for entry in "native-windows.yml" "native-unix.yml" "native-android.yml" "native-ios.yml"; do
            mapfile -t runs < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$entry" \
              --branch main --limit 100 --json databaseId,conclusion \
              | jq -r '[.[] | select(.conclusion=="success") | .databaseId] | .[]')
            for run_id in "${runs[@]}"; do
              # Drafts are intentionally absent from the tag endpoint. A
              # missing/unfinished release must be queued for recovery, not
              # terminate the hourly reconciliation with a 404.
              if published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/minternet-build-$run_id" 2>/dev/null); then
                complete=$(jq -r '(.draft==false) and ([.assets[].name] | index("SHA256SUMS.txt") != null) and ([.assets[].name] | length >= 2)' <<<"$published")
                if [ "$complete" = true ]; then continue; fi
              fi
              available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.expired==false)] | length')
              if [ "$available" -eq 0 ]; then continue; fi
              echo "Retrying missing archive $run_id from $entry" >> "$GITHUB_STEP_SUMMARY"
              gh workflow run publish-current-portable.yml --ref main \
                --repo "$GITHUB_REPOSITORY" -f run_id="$run_id"
              dispatched=$((dispatched+1))
              if [ "$dispatched" -ge 3 ]; then exit 0; fi
              sleep 35
            done
          done
  archive:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate successful first-party run and extract all native build assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="${INPUT_RUN_ID:-${TRIGGER_RUN_ID:-}}"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid run ID"; exit 1; }
          DETAILS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          NAME=$(jq -r '.name' <<<"$DETAILS")
          RESULT=$(jq -r '.conclusion' <<<"$DETAILS")
          BRANCH=$(jq -r '.head_branch' <<<"$DETAILS")
          SRC=$(jq -r '.head_repository.full_name' <<<"$DETAILS")
          SHA=$(jq -r '.head_sha' <<<"$DETAILS")
          test "$RESULT" = "success"
          test "$BRANCH" = "main"
          test "$SRC" = "$GITHUB_REPOSITORY"
          case "$NAME" in
            "Minternet Windows portable single EXE (under 50 MB)") PLATFORM=Windows ;;
            "Native Minternet macOS and Linux (under 50 MB)") PLATFORM=Unix ;;
            "Native Minternet Android APK (< 50 MB)") PLATFORM=Android ;;
            "Native Minternet iOS simulator build (under 50 MB)") PLATFORM=iOS-Simulator ;;
            *) echo "Unrecognized native build workflow: $NAME"; exit 1 ;;
          esac
          TAG="minternet-build-$RUN_ID"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "WORKFLOW_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p release/assets
          # Always reconstruct expected files from the original successful
          # workflow. Incomplete releases are resumed without clobbering.
          mapfile -t ARTIFACTS < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name')
          count=0
          for artifact in "${ARTIFACTS[@]}"; do
            case "$PLATFORM:$artifact" in
              Windows:Minternet-Portable-Windows-x64|Unix:minternet-native-*|Android:minternet-android-debug-apk|iOS-Simulator:minternet-ios-simulator) ;;
              *) continue ;;
            esac
            echo "Retrieving: $artifact"
            dir="release/downloaded/$artifact"
            mkdir -p "$dir"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$dir"
            while IFS= read -r -d '' candidate; do
              case "$candidate" in
                *.exe|*.dmg|*.deb|*.apk|*.zip|*.AppImage) ;;
                *) continue ;;
              esac
              base=$(basename "$candidate")
              if [ "$PLATFORM" = "Windows" ]; then
                filename="Minternet-Portable-x64.exe"
              else
                filename="Minternet-${artifact}-${base}"
              fi
              test ! -f "release/assets/$filename"
              cp "$candidate" "release/assets/$filename"
              size=$(stat -c%s "release/assets/$filename")
              test "$size" -gt 100000
              count=$((count+1))
            done < <(find "$dir" -type f -print0)
          done
          test "$count" -gt 0 || { echo "No compiled binary assets found"; exit 1; }
          (cd release/assets && sha256sum -- * > SHA256SUMS.txt)
          cat > release/notes.md <<EOF
          ## Minternet — Permanent $PLATFORM build archive

          - Source commit: \`$SHA\`
          - Source branch: \`$BRANCH\`
          - Workflow: \`$NAME\`
          - Successful run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - Files: $count
          - Status: unsigned development preview, not independently security audited

          Every successful build is archived under its own immutable-by-policy tag.
          This workflow never clobbers or overwrites an earlier EXE, APK, DMG,
          DEB or simulator package. GitHub Actions' temporary artifacts may expire,
          but release assets remain available unless explicitly deleted.
          Checksums are supplied in SHA256SUMS.txt.

          Rollback: visit GitHub Releases, choose a prior \`minternet-build-<run-id>\`
          entry and download its assets. Local browser profile data is separate
          from the EXE; back up your profile before downgrading across schema changes.
          EOF
      - name: Publish new per-build release without replacing earlier builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's release-by-tag endpoint returns 404 for unpublished
          # drafts. Earlier workflow versions created draft releases, then
          # immediately failed to find them. Recover those exact drafts by
          # release ID; new archives are discoverable prereleases instead.
          # Every asset is staged and checksummed before attempting upload.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            recovered=false
            for page in 1 2 3 4 5; do
              release_page=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page")
              matching_draft=$(jq -c --arg tag "$TAG" '[.[] | select(.tag_name==$tag and .draft==true)] | first // empty' <<<"$release_page")
              if [ -n "$matching_draft" ]; then
                draft_id=$(jq -r '.id' <<<"$matching_draft")
                draft_sha=$(jq -r '.target_commitish' <<<"$matching_draft")
                test "$draft_sha" = "$SHA" || {
                  echo "Existing draft targets a different commit; not publishing it."
                  exit 1
                }
                # Publish the matching legacy draft so tag lookup and uploads
                # work. This never changes existing binary assets.
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" -F draft=false >/dev/null
                recovered=true
                break
              fi
              test "$(jq 'length' <<<"$release_page")" -eq 100 || break
            done
            if [ "$recovered" = false ]; then
              created=false
              for attempt in 1 2 3 4 5; do
                if gh release create "$TAG" \
                  --target "$SHA" --prerelease \
                  --title "Minternet $PLATFORM — build $RUN_ID" \
                  --notes-file release/notes.md \
                  --repo "$GITHUB_REPOSITORY"; then
                  created=true
                  break
                fi
                # GitHub may finish creation despite reporting a transient
                # upload/API error. Check before retrying the same release.
                if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
                  created=true
                  break
                fi
                sleep $((attempt * 4))
              done
              test "$created" = true || { echo "Could not create build release"; exit 1; }
            fi
          fi
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          published_sha=$(jq -r '.target_commitish' <<<"$release_json")
          test "$published_sha" = "$SHA" || {
            echo "The existing release tag belongs to a different commit; refusing to change it."
            exit 1
          }
          for file in release/assets/*; do
            name=$(basename "$file")
            size=$(stat -c%s "$file")
            uploaded=false
            for attempt in 1 2 3 4 5; do
              release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
              remote_size=$(jq -r --arg name "$name" '.assets[] | select(.name==$name) | .size' <<<"$release_json" | head -n 1)
              if [ -n "$remote_size" ]; then
                if [ "$remote_size" != "$size" ]; then
                  echo "Conflicting remote asset $name. Refusing to overwrite a rollback binary."
                  exit 1
                fi
                uploaded=true
                break
              fi
              if gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"; then
                uploaded=true
                break
              fi
              sleep $((attempt * 4))
            done
            test "$uploaded" = true || { echo "Could not upload $name"; exit 1; }
          done
          # Publish only after verifying every expected asset is present.
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          for file in release/assets/*; do
            name=$(basename "$file")
            remote_size=$(jq -r --arg name "$name" '.assets[] | select(.name==$name) | .size' <<<"$release_json" | head -n 1)
            test "$remote_size" = "$(stat -c%s "$file")" || exit 1
          done
          if [ "$(jq -r '.draft' <<<"$release_json")" = true ]; then
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
          echo "Archived permanent rollback: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $SHA" >> "$GITHUB_STEP_SUMMARY"
