name: Tor Plaintext DNS Packet Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/tor-dns-capture.sh'
      - '.github/workflows/tor-dns-capture.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 10 * * 2'
permissions:
  contents: read
jobs:
  transport-dns-capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop/src-tauri -> target
      - name: Install native compile and DNS capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tcpdump libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Compile Minternet native Arti executable
        working-directory: native/desktop
        run: |
          npm install --no-fund --no-audit
          npm run build
      - name: Capture plaintext DNS packets during real Tor probe
        run: |
          set -euo pipefail
          bash scripts/tor-dns-capture.sh native/desktop/src-tauri/target/release/minternet_native
          echo "PASS: No destination DNS query observed in port-53 packet capture." >> "$GITHUB_STEP_SUMMARY"
      - name: Record scope
        if: always()
        run: |
          echo "LIMIT: This proves only a transport-specific port-53 destination check, not a full browser no-leak guarantee." >> "$GITHUB_STEP_SUMMARY"
