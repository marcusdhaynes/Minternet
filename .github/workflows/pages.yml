name: Publish Minternet UI preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild the public status snapshot when a real Windows run changes phase.
  # Polling a static JSON file cannot otherwise report Initiating/Building/Ready.
  workflow_run:
    workflows: ["Minternet Windows portable single EXE (under 50 MB)"]
    types: [requested, in_progress, completed]
    branches: [main]
  # Recover from dropped workflow_run events or a failed Pages deployment.
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
# Never let a backlog of old source previews hold up the current status.
# Finished previews remain archived; pending refreshes coalesce.
concurrency:
  group: minternet-pages-live-refresh
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static UI preview
        run: |
          mkdir -p site
          # Include every UI module referenced by the page, not a handpicked subset.
          cp -a ui/. site/
          cp docs/preview-bridge.js site/preview-bridge.js
          cp docs/preview.css site/preview.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text()
          needle = '<script src="./app.js" defer></script>'
          assert needle in s
          s = s.replace(needle, '<script src="./preview-bridge.js" defer></script>\n  ' + needle)
          assert "frame-src 'none'" in s
          s = s.replace("frame-src 'none'", 'frame-src https:')
          s = s.replace('<link rel="stylesheet" href="./styles.css">', '<link rel="stylesheet" href="./styles.css">\n  <link rel="stylesheet" href="./preview.css">')
          p.write_text(s)
          PY
          node --check site/preview-bridge.js
          test -s site/preview.css
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/build-info.json').write_text(json.dumps({
              'platform':'web-preview',
              'sourceCommit':os.environ['GITHUB_SHA'],
              'workflowRun':os.environ['GITHUB_RUN_ID']
          }, indent=2))
          PY
          touch site/.nojekyll
      - name: Publish rate-limit-safe, verified update status feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,time,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          head=os.environ['GITHUB_SHA']
          token=os.environ['GH_TOKEN']
          def get(endpoint):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                           'User-Agent':'Minternet-verified-update-feed'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  return json.load(response)
          run=None
          try:
              runs=get('actions/workflows/native-windows.yml/runs?branch=main&per_page=20')
              all_runs=[r for r in runs.get('workflow_runs',[]) if r.get('head_branch')=='main']
              # A prior failed/cancelled commit must not masquerade as the
              # current source's ongoing build.
              run=next((r for r in all_runs if r.get('head_sha')==head),None)
              if run is None and all_runs:
                  run=all_runs[0]
          except Exception as ex:
              print('Build state temporarily unavailable:',type(ex).__name__)
          chosen=None
          pattern=re.compile(r'^v(\d+)\.(\d+)\.(\d+)-build\.(\d+)-g[0-9a-f]{8}$')
          for page in range(1,11):
              try: releases=get('releases?per_page=100&page='+str(page))
              except Exception as ex:
                  print('Release feed scan unavailable:',type(ex).__name__)
                  break
              for entry in releases:
                  tag=entry.get('tag_name','')
                  found=pattern.fullmatch(tag)
                  if not found or entry.get('draft') or entry.get('prerelease'):continue
                  expected='Minternet-Windows-Portable-'+tag+'.exe'
                  assets={a.get('name'):a for a in entry.get('assets',[])}
                  exe=assets.get(expected)
                  sums=assets.get('SHA256SUMS.txt')
                  if not exe or not sums or not 100000<=exe.get('size',0)<50000000 or sums.get('size',0)<=0:
                      continue
                  prefix='https://github.com/'+repo+'/releases/download/'+tag+'/'
                  if exe.get('browser_download_url')!=prefix+expected or sums.get('browser_download_url')!=prefix+'SHA256SUMS.txt':
                      continue
                  key=tuple(map(int,found.groups()))
                  if chosen is None or key>chosen[0]:
                      chosen=(key,{
                        'version':tag[1:],'tag':tag,
                        'sourceSha':entry.get('target_commitish',''),
                        'url':entry.get('html_url',''),
                        'downloadUrl':exe['browser_download_url'],
                        'checksumUrl':sums['browser_download_url'],
                        'notes':(entry.get('body') or '')[:2000]
                      })
              if len(releases)<100:break
          current={
            'schema':1,'generatedAt':int(time.time()),'sourceSha':head,'workflowRun':os.environ['GITHUB_RUN_ID'],
            'release':chosen[1] if chosen else None,
            'windowsRun':({k:run.get(k) for k in ('head_sha','run_number','status','conclusion','html_url')}
                         if run else None)
          }
          Path('site/update-feed.json').write_text(json.dumps(current,separators=(',',':')))
          print('Generated update-feed.json for',head[:8],
                'release',current['release']['tag'] if current['release'] else 'none')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Archive this commit's web preview
        uses: actions/upload-artifact@v4
        with:
          name: minternet-web-preview-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 90
      - name: Check whether this is still the current main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Archived this revision; skipping stale Pages deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy site
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
