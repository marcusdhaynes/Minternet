name: Publish Minternet UI preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Each SHA gets its own durable Web preview artifact; only current main
# may replace the live Pages site, preventing out-of-order deploy regressions.
concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static UI preview
        run: |
          mkdir -p site
          # Include every UI module referenced by the page, not a handpicked subset.
          cp -a ui/. site/
          cp docs/preview-bridge.js site/preview-bridge.js
          cp docs/preview.css site/preview.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text()
          needle = '<script src="./app.js" defer></script>'
          assert needle in s
          s = s.replace(needle, '<script src="./preview-bridge.js" defer></script>\n  ' + needle)
          assert "frame-src 'none'" in s
          s = s.replace("frame-src 'none'", 'frame-src https:')
          s = s.replace('<link rel="stylesheet" href="./styles.css">', '<link rel="stylesheet" href="./styles.css">\n  <link rel="stylesheet" href="./preview.css">')
          p.write_text(s)
          PY
          node --check site/preview-bridge.js
          test -s site/preview.css
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/build-info.json').write_text(json.dumps({
              'platform':'web-preview',
              'sourceCommit':os.environ['GITHUB_SHA'],
              'workflowRun':os.environ['GITHUB_RUN_ID']
          }, indent=2))
          PY
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Archive this commit's web preview
        uses: actions/upload-artifact@v4
        with:
          name: minternet-web-preview-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 90
      - name: Check whether this is still the current main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Archived this revision; skipping stale Pages deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy site
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
