name: Publish Minternet UI preview
on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'docs/preview-bridge.js'
      - 'docs/preview.css'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static UI preview
        run: |
          mkdir -p site
          cp ui/minternet-brand.webp ui/minternet-brand.png site/
          cp ui/index.html ui/styles.css ui/app.js ui/native-bridge.js ui/bookmark-model.js ui/bookmark-ui.js ui/tab-group-model.js ui/tab-group-ui.js ui/chrome-native-menu.js ui/search-settings.js site/
          cp docs/preview-bridge.js site/preview-bridge.js
          cp docs/preview.css site/preview.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text()
          needle = '<script src="./app.js" defer></script>'
          assert needle in s
          s = s.replace(needle, '<script src="./preview-bridge.js" defer></script>\n  ' + needle)
          assert "frame-src 'none'" in s
          s = s.replace("frame-src 'none'", 'frame-src https:')
          s = s.replace('<link rel="stylesheet" href="./styles.css">', '<link rel="stylesheet" href="./styles.css">\n  <link rel="stylesheet" href="./preview.css">')
          p.write_text(s)
          PY
          node --check site/preview-bridge.js
          test -s site/preview.css
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
