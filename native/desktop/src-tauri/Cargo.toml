[package]
name = "minternet_native"
version = "0.3.0"
description = "Minternet lightweight native system-webview browser"
authors = ["Minternet"]
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
zeroize = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
# Read only the Firefox bookmark-folder subtree explicitly dragged by the user.
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Explorer's native PIDL selection, not a plain open-folder command.
showfile = "0.1.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Security_Credentials", "Win32_System_Com"] }

# Native file drag-out from the Downloads popup; no file data enters JS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"
