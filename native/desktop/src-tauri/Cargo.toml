[package]
name = "minternet_native"
version = "0.3.0"
description = "Minternet lightweight native system-webview browser"
authors = ["Minternet"]
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
