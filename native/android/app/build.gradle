plugins {
    id 'com.android.application'
}

// All platform builds use the same base version and source SHA. Incrementing
// versionCode for each CI run makes newer APKs distinguishable from old ones.
// Release signing is deliberately NOT fabricated: debug APKs are previews.
def sharedVersion = new groovy.json.JsonSlurper()
    .parse(file('../../desktop/src-tauri/tauri.conf.json')).version.toString()
def ciNumber = System.getenv('GITHUB_RUN_NUMBER')
def ciSha = System.getenv('GITHUB_SHA')
def distributionCode = System.getenv('MINTERNET_ANDROID_VERSION_CODE')
if (distributionCode != null && (!distributionCode.isInteger() ||
        distributionCode.toLong() < 1 || distributionCode.toLong() > 2100000000L)) {
    throw new GradleException('Invalid Android distribution versionCode')
}
def buildNumber = distributionCode != null ? distributionCode.toInteger() :
    (ciNumber?.isInteger() ? ciNumber.toInteger() : 1)
def buildSuffix = ciSha?.length() >= 8 ? "-g" + ciSha.substring(0, 8) : "-local"
android {
    namespace 'app.minternet.browser'
    compileSdk 35
    defaultConfig {
        applicationId 'app.minternet.browser'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "${sharedVersion}-build.${buildNumber}${buildSuffix}"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Native Google account authentication and push-only Realtime WebSockets.
dependencies {
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
